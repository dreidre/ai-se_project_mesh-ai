run-name: 'Running tests for ${{ github.event.head_commit.message }}'

on:
  push:
    branches:
      - main
jobs:
  auto-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Set up GitHub Actions
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        run: |
          npm ci --loglevel=error --no-fund --no-audit --ignore-scripts
          npm i github:tripleten-com/se-actions-lib-p#v0.0.1

      - name: Run main tests
        run: node .github/bin/main.js

      - name: Build the project
        run: npm run build

      - name: Installing wait-port
        run: npm install -g wait-port

      - name: Run server
        run: npm run start & wait-port -t 30000 localhost:3000

      - name: Run collection tests
        run: npx se-test-mesh-ai-part1
